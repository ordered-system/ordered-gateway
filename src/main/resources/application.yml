server:
  port: 8080

spring:
  application:
    name: ordered-gateway
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      fail-fast: true
    gateway:
      server:
        webflux:
          routes:
            - id: order-service-route
              uri: lb://order-service
              predicates:
                - Path=/api/v1/orders/**,/api/v1/payments/**
            - id: product-service-route
              uri: lb://product-service
              predicates:
                - Path=/api/v1/products/**,/api/v1/cart/**
            - id: engagement-service-route
              uri: lb://engagement-service
              predicates:
                - Path=/api/v1/reviews/**,/api/v1/browsing-history/**
            - id: user-service-route
              uri: lb://user-service
              predicates:
                - Path=/api/v1/users/**,/api/v1/auth/**,/api/v1/addresses/**
            - id: order-service-docs
              uri: lb://order-service
              predicates:
                - Path=/order-service/v3/api-docs
              filters:
                - RewritePath=/order-service/v3/api-docs, /v3/api-docs
            - id: product-service-docs
              uri: lb://product-service
              predicates:
                - Path=/product-service/v3/api-docs
              filters:
                - RewritePath=/product-service/v3/api-docs, /v3/api-docs
            - id: user-service-docs
              uri: lb://user-service
              predicates:
                - Path=/user-service/v3/api-docs
              filters:
                - RewritePath=/user-service/v3/api-docs, /v3/api-docs
            - id: engagement-service-docs
              uri: lb://engagement-service
              predicates:
                - Path=/engagement-service/v3/api-docs
              filters:
                - RewritePath=/engagement-service/v3/api-docs, /v3/api-docs
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

ordered:
  gateway:
    security:
      public-paths:
        - /api/v1/auth/**
        - /actuator/**
        - /api/v1/products/**
        - /api/v1/products
        - /api/v1/reviews/product/**
        - /swagger-ui/**
        - /swagger-ui.html
        - /v3/api-docs/**
        - /*/v3/api-docs

springdoc:
  swagger-ui:
    urls:
      - name: order-service
        url: /order-service/v3/api-docs
      - name: product-service
        url: /product-service/v3/api-docs
      - name: user-service
        url: /user-service/v3/api-docs
      - name: engagement-service
        url: /engagement-service/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    org.springframework.cloud.gateway: INFO